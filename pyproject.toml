[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wavetrinext"
version = "0.1.0"
description = "WaveTriNeXt and five closed-set waste-classification paper configurations"
requires-python = ">=3.10"
dependencies = ["torch>=2.8,<2.9", "torchvision>=0.23,<0.24", "numpy>=2.2,<2.3", "pandas>=2.3,<2.4", "Pillow>=12.1,<13", "scipy>=1.15,<1.16", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
